services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -o /dev/null -Q \"IF EXISTS (SELECT 1 FROM sys.databases WHERE state_desc <> 'ONLINE' OR DATABASEPROPERTYEX(name, 'Collation') IS NULL) RAISERROR('Databases are not ready yet', 16, 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DataSource: Sql
      ConnectionStrings__ProductCatalog: "Server=sql,1433;Database=ProductCatalog;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=true"
    ports:
      - "8080:8080"
    restart: on-failure
    depends_on:
      sql:
        condition: service_healthy

volumes:
  sql-data:
